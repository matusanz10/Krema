<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Krema"/>
<title>Krema</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:-apple-system,system-ui,sans-serif;background:#f5f3ff;min-height:100vh;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
button,input,select{font-family:inherit;font-size:16px}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:10px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.btn{border:none;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:5px;padding:9px 15px;font-size:14px}
.btn-sm{padding:6px 10px;font-size:13px}
.btn-primary{background:#7c3aed;color:#fff}
.btn-danger{background:#ef4444;color:#fff}
.btn-ghost{background:#f3f4f6;color:#374151}
.btn-success{background:#10b981;color:#fff}
.inp{border:1.5px solid #e5e7eb;border-radius:8px;padding:9px 12px;font-size:16px;width:100%;background:#fafafa;outline:none}
.lbl{font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:3px}
.row{display:flex;gap:8px}
.col{display:flex;flex-direction:column;gap:4px;flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#header{background:#7c3aed;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
#content{padding:14px;max-width:600px;margin:0 auto}
#bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ede9fe;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:100}
.nav-btn{flex:1;background:none;border:none;cursor:pointer;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;font-weight:500;color:#9ca3af}
.nav-btn.active{color:#7c3aed;font-weight:700}
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:flex-end;justify-content:center}
#modal-overlay.show{display:flex}
#modal-box{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
#modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #f0f0f0;position:sticky;top:0;background:#fff;z-index:10}
#modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:2000;white-space:nowrap;display:none;color:#fff}
.empty{text-align:center;padding:48px 24px;color:#9ca3af}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat-card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.sep{border:none;border-top:1px solid #f3f4f6;margin:6px 0}
svg{display:inline-block;vertical-align:middle;flex-shrink:0}
</style>
</head>
<body>

<div id="header">
  <span style="font-size:22px">🥛</span>
  <span style="color:#fff;font-weight:800;font-size:20px;letter-spacing:-0.5px">Krema</span>
  <span style="color:#c4b5fd;font-size:12px;margin-left:2px">gestión</span>
</div>

<div id="content"></div>

<div id="bottom-nav">
  <button class="nav-btn active" data-tab="dashboard" onclick="goTab('dashboard')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    Inicio
  </button>
  <button class="nav-btn" data-tab="ventas" onclick="goTab('ventas')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    Ventas
  </button>
  <button class="nav-btn" data-tab="clientes" onclick="goTab('clientes')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Clientes
  </button>
  <button class="nav-btn" data-tab="stock" onclick="goTab('stock')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
    Stock
  </button>
  <button class="nav-btn" data-tab="gastos" onclick="goTab('gastos')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
    Gastos
  </button>
  <button class="nav-btn" data-tab="produccion" onclick="goTab('produccion')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="7" y1="20" x2="7" y2="16"/><line x1="12" y1="20" x2="12" y2="12"/><line x1="17" y1="20" x2="17" y2="8"/><line x1="22" y1="20" x2="22" y2="4"/></svg>
    Prod.
  </button>
  <button class="nav-btn" data-tab="canjes" onclick="goTab('canjes')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
    Canjes
  </button>
</div>

<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal-box">
    <div id="modal-header">
      <span id="modal-title" style="font-size:16px;font-weight:700"></span>
      <button onclick="closeModal()" style="background:none;border:none;cursor:pointer;color:#6b7280;padding:4px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Data ────────────────────────────────────────────────────────────────────
const KEY = 'krema_v2';
let DB = {clientes:[],ventas:[],productos:[
  {id:'p1',nombre:'Yogur griego 350g',precio:0,unidad:'unidad'},
  {id:'p2',nombre:'Yogur griego 700g',precio:0,unidad:'unidad'},
],stock:[],gastos:[],lotes:[],canjes:[]};

function load(){try{const r=localStorage.getItem(KEY);if(r)DB={...DB,...JSON.parse(r)};}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

// ── Helpers ─────────────────────────────────────────────────────────────────
const fmt=n=>'$'+Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:0});
const fmtD=d=>d?new Date(d+'T00:00:00').toLocaleDateString('es-AR'):'-';
const today=()=>new Date().toISOString().split('T')[0];
const todayMonth=()=>today().slice(0,7);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const BADGE_COLORS={
  green:'background:#d1fae5;color:#065f46',
  yellow:'background:#fef3c7;color:#92400e',
  red:'background:#fee2e2;color:#991b1b',
  blue:'background:#dbeafe;color:#1e40af',
  purple:'background:#ede9fe;color:#5b21b6',
  gray:'background:#f3f4f6;color:#374151',
  teal:'background:#ccfbf1;color:#134e4a',
};
const badge=(txt,col='gray')=>`<span class="badge" style="${BADGE_COLORS[col]||BADGE_COLORS.gray}">${esc(txt)}</span>`;

// ── Toast ────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=(type==='ok'?'✅ ':'⚠️ ')+msg;
  el.style.background=type==='ok'?'#10b981':'#ef4444';
  el.style.display='block';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.style.display='none',2500);
}

// ── Modal ────────────────────────────────────────────────────────────────────
function openModal(title,html){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('show');
  document.getElementById('modal-body').innerHTML='';
}

// ── Nav ──────────────────────────────────────────────────────────────────────
let currentTab='dashboard';
function goTab(tab){
  currentTab=tab;
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.tab===tab);
  });
  render();
}
function render(){
  const fns={dashboard:renderDashboard,ventas:renderVentas,clientes:renderClientes,stock:renderStock,gastos:renderGastos,produccion:renderProduccion,canjes:renderCanjes};
  document.getElementById('content').innerHTML=fns[currentTab]?fns[currentTab]():'';
}

// ════════════════════════════════════════════════════════
// DASHBOARD
// ════════════════════════════════════════════════════════
function renderDashboard(){
  const now=new Date(),m=now.getMonth(),a=now.getFullYear();
  const inMes=fecha=>{const d=new Date(fecha+'T00:00:00');return d.getMonth()===m&&d.getFullYear()===a};
  const vMes=DB.ventas.filter(v=>inMes(v.fecha));
  const ingresos=vMes.reduce((s,v)=>s+Number(v.total),0);
  const gastosMes=DB.gastos.filter(g=>inMes(g.fecha)).reduce((s,g)=>s+Number(g.monto),0);
  const pendiente=vMes.filter(v=>v.estado!=='Cobrado').reduce((s,v)=>s+Number(v.total),0);
  const ganancia=ingresos-gastosMes;
  const stockBajo=DB.stock.filter(s=>Number(s.cantidad)<=Number(s.alerta||0)&&s.alerta>0);
  const loteActivo=DB.lotes.filter(l=>l.estado==='En fermentación').length;

  const meses=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const chart6=Array.from({length:6},(_,i)=>{
    const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(5-i));
    const cm=d.getMonth(),ca=d.getFullYear();
    return {
      l:meses[cm],
      i:DB.ventas.filter(v=>{const dd=new Date(v.fecha+'T00:00:00');return dd.getMonth()===cm&&dd.getFullYear()===ca}).reduce((s,v)=>s+Number(v.total),0),
      g:DB.gastos.filter(g=>{const dd=new Date(g.fecha+'T00:00:00');return dd.getMonth()===cm&&dd.getFullYear()===ca}).reduce((s,g)=>s+Number(g.monto),0),
    };
  });
  const maxV=Math.max(...chart6.map(d=>Math.max(d.i,d.g)),1);

  const chartBars=chart6.map(d=>`
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
      <div style="display:flex;gap:2px;align-items:flex-end;height:60px">
        <div style="width:11px;height:${Math.max(2,Math.round(d.i/maxV*60))}px;background:#7c3aed;border-radius:2px 2px 0 0"></div>
        <div style="width:11px;height:${Math.max(2,Math.round(d.g/maxV*60))}px;background:#fca5a5;border-radius:2px 2px 0 0"></div>
      </div>
      <div style="font-size:10px;color:#9ca3af">${d.l}</div>
    </div>`).join('');

  const ultVentas=[...DB.ventas].sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,5);
  const ventasHTML=ultVentas.length===0
    ?'<div style="font-size:13px;color:#9ca3af">Sin ventas aún</div>'
    :ultVentas.map(v=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f9fafb;font-size:13px">
        <div>
          <span style="font-weight:600">${esc(v.clienteNombre||'Sin nombre')}</span>
          <span style="color:#9ca3af;margin-left:6px;font-size:11px">${fmtD(v.fecha)}</span>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <span style="font-weight:700">${fmt(v.total)}</span>
          ${badge(v.estado,v.estado==='Cobrado'?'green':v.estado==='Fiado'?'red':'yellow')}
        </div>
      </div>`).join('');

  return `
    <h2 style="font-weight:800;color:#1f2937;font-size:20px;margin-bottom:14px">Resumen del mes</h2>
    <div class="stat-grid">
      <div class="stat-card"><div style="font-size:12px;color:#6b7280;margin-bottom:2px">Ingresos</div><div style="font-size:22px;font-weight:800;color:#7c3aed">${fmt(ingresos)}</div><div style="font-size:11px;color:#9ca3af">${vMes.length} ventas</div></div>
      <div class="stat-card"><div style="font-size:12px;color:#6b7280;margin-bottom:2px">Gastos</div><div style="font-size:22px;font-weight:800;color:#ef4444">${fmt(gastosMes)}</div></div>
      <div class="stat-card"><div style="font-size:12px;color:#6b7280;margin-bottom:2px">Ganancia</div><div style="font-size:22px;font-weight:800;color:${ganancia>=0?'#10b981':'#ef4444'}">${fmt(ganancia)}</div></div>
      <div class="stat-card"><div style="font-size:12px;color:#6b7280;margin-bottom:2px">Por cobrar</div><div style="font-size:22px;font-weight:800;color:#f59e0b">${fmt(pendiente)}</div></div>
    </div>
    <div class="card">
      <div style="font-weight:700;font-size:14px;margin-bottom:10px">Últimos 6 meses</div>
      <div style="display:flex;align-items:flex-end;gap:4px;height:80px">${chartBars}</div>
      <div style="display:flex;gap:12px;margin-top:6px">
        <div style="display:flex;align-items:center;gap:4px;font-size:11px;color:#6b7280"><div style="width:8px;height:8px;border-radius:2px;background:#7c3aed"></div> Ingresos</div>
        <div style="display:flex;align-items:center;gap:4px;font-size:11px;color:#6b7280"><div style="width:8px;height:8px;border-radius:2px;background:#fca5a5"></div> Gastos</div>
      </div>
    </div>
    <div class="grid2" style="margin-bottom:10px">
      <div class="card" style="margin-bottom:0">
        <div style="font-weight:700;font-size:13px;margin-bottom:8px">⚠️ Stock bajo</div>
        ${stockBajo.length===0?'<div style="font-size:12px;color:#9ca3af">Todo OK ✓</div>':stockBajo.map(s=>`<div style="font-size:12px;color:#b45309">• ${esc(s.nombre)}: ${s.cantidad}</div>`).join('')}
      </div>
      <div class="card" style="margin-bottom:0">
        <div style="font-weight:700;font-size:13px;margin-bottom:8px">🧪 Estado</div>
        <div style="font-size:12px;color:#6b7280">Lotes activos: <b style="color:#7c3aed">${loteActivo}</b></div>
        <div style="font-size:12px;color:#6b7280;margin-top:3px">Clientes: <b style="color:#7c3aed">${DB.clientes.length}</b></div>
        <div style="font-size:12px;color:#6b7280;margin-top:3px">Canjes: <b style="color:#7c3aed">${DB.canjes.filter(c=>c.estado==='Aceptado').length}</b></div>
      </div>
    </div>
    <div class="card">
      <div style="font-weight:700;font-size:14px;margin-bottom:10px">Últimas ventas</div>
      ${ventasHTML}
    </div>`;
}

// ════════════════════════════════════════════════════════
// VENTAS
// ════════════════════════════════════════════════════════
let ventaFiltro='';
function renderVentas(){
  const pendienteTotal=DB.ventas.filter(v=>v.estado!=='Cobrado').reduce((s,v)=>s+Number(v.total),0);
  const lista=[...DB.ventas]
    .filter(v=>!ventaFiltro||(v.clienteNombre||'').toLowerCase().includes(ventaFiltro.toLowerCase()))
    .sort((a,b)=>b.fecha.localeCompare(a.fecha));

  const rows=lista.length===0
    ?'<div class="empty"><div style="font-size:36px;opacity:.3;margin-bottom:8px">🛒</div><div style="font-weight:600;color:#6b7280">Sin ventas</div></div>'
    :lista.map(v=>`
      <div class="card" style="padding:12px 14px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <span style="font-weight:700;font-size:15px">${esc(v.clienteNombre||'Sin nombre')}</span>
              ${badge(v.estado,v.estado==='Cobrado'?'green':v.estado==='Fiado'?'red':'yellow')}
            </div>
            <div style="font-size:11px;color:#9ca3af;margin-top:2px">${fmtD(v.fecha)} · ${esc(v.formaPago)}</div>
            <div style="font-size:11px;color:#6b7280;margin-top:2px">${(v.items||[]).map(i=>`${esc(i.nombre||'Prod')} x${i.cantidad}`).join(' · ')}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:8px">
            <span style="font-size:17px;font-weight:800;color:#7c3aed">${fmt(v.total)}</span>
            <div style="display:flex;gap:4px">
              <button class="btn btn-ghost btn-sm" onclick="toggleEstadoVenta('${v.id}')">✓</button>
              <button class="btn btn-ghost btn-sm" onclick="editarVenta('${v.id}')">✎</button>
              <button class="btn btn-danger btn-sm" onclick="eliminarVenta('${v.id}')">🗑</button>
            </div>
          </div>
        </div>
      </div>`).join('');

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="font-weight:800;color:#1f2937;font-size:20px">Ventas</h2>
      <button class="btn btn-primary" onclick="nuevaVenta()">+ Nueva</button>
    </div>
    ${pendienteTotal>0?`<div style="background:#fef3c7;border:1px solid #f59e0b;border-radius:10px;padding:9px 13px;font-size:13px;color:#92400e;font-weight:600;margin-bottom:10px">💰 Por cobrar: ${fmt(pendienteTotal)}</div>`:''}
    <input class="inp" placeholder="Buscar cliente..." value="${esc(ventaFiltro)}" oninput="ventaFiltro=this.value;render()" style="margin-bottom:10px"/>
    ${rows}`;
}

function toggleEstadoVenta(id){
  const ciclo=['Cobrado','Pendiente','Fiado'];
  const v=DB.ventas.find(x=>x.id===id);
  if(!v)return;
  v.estado=ciclo[(ciclo.indexOf(v.estado)+1)%3];
  save();render();
}
function eliminarVenta(id){
  if(!confirm('¿Eliminar esta venta?'))return;
  DB.ventas=DB.ventas.filter(v=>v.id!==id);
  save();render();toast('Venta eliminada');
}

let ventaEditId=null;
let ventaItems=[{productoId:'',nombre:'',cantidad:1,precio:0}];

function nuevaVenta(){ventaEditId=null;ventaItems=[{productoId:'',nombre:'',cantidad:1,precio:0}];abrirFormVenta();}
function editarVenta(id){
  const v=DB.ventas.find(x=>x.id===id);
  if(!v)return;
  ventaEditId=id;
  ventaItems=(v.items||[]).map(i=>({...i}));
  abrirFormVenta(v);
}

function abrirFormVenta(v){
  const opts=DB.clientes.map(c=>`<option value="${c.id}"${v&&v.clienteId===c.id?' selected':''}>${esc(c.nombre)}</option>`).join('');
  const pOpts=DB.productos.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('');
  openModal(ventaEditId?'Editar venta':'Nueva venta',`
    <div class="col"><label class="lbl">Cliente guardado</label>
      <select class="inp" id="vClienteId" onchange="onClienteChange()">
        <option value="">— Escribir nombre —</option>${opts}
      </select>
    </div>
    <div class="col" id="vNombreWrap"><label class="lbl">Nombre</label><input class="inp" id="vNombre" value="${esc(v?v.clienteNombre:'')}" placeholder="Nombre del cliente"/></div>
    <div class="grid2">
      <div class="col"><label class="lbl">Fecha</label><input class="inp" type="date" id="vFecha" value="${v?v.fecha:today()}"/></div>
      <div class="col"><label class="lbl">Forma de pago</label>
        <select class="inp" id="vPago">
          ${['Efectivo','Transferencia','MercadoPago','Canje'].map(p=>`<option${v&&v.formaPago===p?' selected':''}>${p}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="col"><label class="lbl">Estado de cobro</label>
      <select class="inp" id="vEstado">

    </div>

  `);

}

function onClienteChange(){
  const val=document.getElementById('vClienteId').value;
  document.getElementById('vNombreWrap').style.display=val?'none':'flex';
}

function renderVentaItems(pOpts){
  if(!pOpts){pOpts=DB.productos.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('');}
  const wrap=document.getElementById('vItemsWrap');
  if(!wrap)return;
  wrap.innerHTML=ventaItems.map((it,i)=>`
    <div style="border:1px solid #e5e7eb;border-radius:8px;padding:10px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:12px;font-weight:600;color:#6b7280">Ítem ${i+1}</span>
        ${ventaItems.length>1?`<button onclick="removeVentaItem(${i})" style="background:none;border:none;cursor:pointer;color:#ef4444;font-size:16px">×</button>`:''}
      </div>
      <select class="inp" onchange="onProdSelect(${i},this.value)" style="margin-bottom:6px">
        <option value="">Producto libre</option>${pOpts.replace(`value="${it.productoId}"`,`value="${it.productoId}" selected`)}
      </select>
      ${!it.productoId?`<input class="inp" placeholder="Nombre" value="${esc(it.nombre)}" oninput="ventaItems[${i}].nombre=this.value" style="margin-bottom:6px"/>`:''}
      <div class="grid2">
        <input class="inp" type="number" placeholder="Cantidad" value="${it.cantidad}" oninput="ventaItems[${i}].cantidad=this.value;updateVentaTotal()"/>
        <input class="inp" type="number" placeholder="Precio $" value="${it.precio}" oninput="ventaItems[${i}].precio=this.value;updateVentaTotal()"/>
      </div>
    </div>`).join('');
  updateVentaTotal();
}

function onProdSelect(i,val){
  ventaItems[i].productoId=val;
  if(val){const p=DB.productos.find(x=>x.id===val);if(p){ventaItems[i].nombre=p.nombre;ventaItems[i].precio=p.precio;}}
  else{ventaItems[i].nombre='';ventaItems[i].precio=0;}
  renderVentaItems();
}
function addVentaItem(){ventaItems.push({productoId:'',nombre:'',cantidad:1,precio:0});renderVentaItems();}
function removeVentaItem(i){ventaItems.splice(i,1);renderVentaItems();}
function updateVentaTotal(){
  const t=ventaItems.reduce((s,it)=>s+Number(it.cantidad||0)*Number(it.precio||0),0);
  const el=document.getElementById('vTotal');if(el)el.textContent='Total: '+fmt(t);
}
function guardarVenta(){
  const clienteId=document.getElementById('vClienteId').value;
  const clienteNombre=clienteId?(DB.clientes.find(c=>c.id===clienteId)?.nombre||''):document.getElementById('vNombre').value;
  const fecha=document.getElementById('vFecha').value;
  if(!fecha)return toast('Falta la fecha','err');
  const total=ventaItems.reduce((s,it)=>s+Number(it.cantidad||0)*Number(it.precio||0),0);
  const venta={clienteId,clienteNombre,fecha,items:ventaItems.map(i=>({...i})),formaPago:document.getElementById('vPago').value,estado:document.getElementById('vEstado').value,notas:document.getElementById('vNotas').value,total};
  if(ventaEditId){DB.ventas=DB.ventas.map(v=>v.id===ventaEditId?{...venta,id:ventaEditId}:v);}
  else{DB.ventas.push({...venta,id:uid()});}
  save();closeModal();render();toast('Venta guardada');
}

}

              <button onclick="ajustarStock('${s.id}',1)" style="width:32px;height:32px;border-radius:8px;border:1.5px solid #e5e7eb;background:#fff;cursor:pointer;font-size:18px">+</button>
              <button class="btn btn-ghost btn-sm" onclick="editarInsumo('${s.id}')">✎</button>
              <button class="btn btn-danger btn-sm" onclick="eliminarInsumo('${s.id}')">🗑</button>

          </div>

  } else {

            </div>
          </div>
        </div>`).join('');
  }

  const btnLabel=stockSubtab==='insumos'?'+ Insumo':'+ Producto';

let gastoMes=todayMonth();

  const CATS=['Insumos','Packaging','Transporte','Marketing','Servicios','Otros'];

  const porCat=CATS.map(c=>({c,t:lista.filter(g=>g.categoria===c).reduce((s,g)=>s+Number(g.monto),0)})).filter(x=>x.t>0).sort((a,b)=>b.t-a.t);

            <span style="font-weight:700;font-size:13px">${fmt(x.t)}</span>
          </div>

    :lista.map(g=>`
      <div class="card" style="padding:12px 14px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-weight:700">${esc(g.concepto)}</div>

            <span style="font-weight:800;font-size:16px;color:#ef4444">${fmt(g.monto)}</span>
            <button class="btn btn-ghost btn-sm" onclick="editarGasto('${g.id}')">✎</button>

      </div>`).join('');

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="font-weight:800;color:#1f2937;font-size:20px">Gastos</h2>

      <input type="month" class="inp" value="${gastoMes}" oninput="gastoMes=this.value;render()" style="flex:1"/>

    </div>
    ${catHTML}${rows}`;

  const concepto=document.getElementById('gConcepto').value.trim();
  const monto=Number(document.getElementById('gMonto').value);
  if(!concepto||!monto)return toast('Completá concepto y monto','err');
  const obj={concepto,monto,categoria:document.getElementById('gCat').value,fecha:document.getElementById('gFecha').value,notas:document.getElementById('gNotas').value};
  if(id){DB.gastos=DB.gastos.map(g=>g.id===id?{...obj,id}:g);}else{DB.gastos.push({...obj,id:uid()});}
  save();closeModal();render();toast('Gasto guardado');
}

// ════════════════════════════════════════════════════════
// PRODUCCIÓN
// ════════════════════════════════════════════════════════
function renderProduccion(){
  const rows=DB.lotes.length===0
    ?'<div class="empty"><div style="font-size:36px;opacity:.3;margin-bottom:8px">🧪</div><div style="font-weight:600;color:#6b7280">Sin lotes</div><div style="font-size:13px">Registrá cada fermentación</div></div>'
    :[...DB.lotes].sort((a,b)=>b.fechaInicio.localeCompare(a.fechaInicio)).map(l=>{
      const ec=l.estado==='En fermentación'?'yellow':l.estado==='Listo'?'green':l.estado==='Entregado'?'teal':'red';
      return `<div class="card" style="padding:12px 14px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
              <span style="font-weight:700">${esc(l.producto||'Lote')}</span>
              ${badge(l.estado,ec)}
            </div>
            <div style="font-size:11px;color:#9ca3af;margin-top:3px">${fmtD(l.fechaInicio)}${l.fechaFin?' → '+fmtD(l.fechaFin):''}</div>
            <div style="font-size:12px;color:#6b7280;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap">
              <span>🥛 ${l.litros}L</span>
              ${l.rendimiento?`<span>📦 ${l.rendimiento} unid.</span>`:''}
              <span>🌡️ ${l.tempCultura}°C</span>
            </div>
            ${l.notas?`<div style="font-size:11px;color:#9ca3af;margin-top:3px;font-style:italic">${esc(l.notas)}</div>`:''}
          </div>
          <div style="display:flex;gap:4px">
            <button class="btn btn-ghost btn-sm" onclick="editarLote('${l.id}')">✎</button>
            <button class="btn btn-danger btn-sm" onclick="eliminarLote('${l.id}')">🗑</button>
          </div>
        </div>
      </div>`;}).join('');

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="font-weight:800;color:#1f2937;font-size:20px">Producción</h2>
      <button class="btn btn-primary" onclick="nuevoLote()">+ Lote</button>
    </div>
    <div style="background:#ede9fe;border-radius:10px;padding:10px 14px;font-size:13px;color:#5b21b6;margin-bottom:12px">
      🌡️ Óptima: <b>42°C</b> · Rango: 41–44°C · Muere sobre 46°C
    </div>${rows}`;
}

function nuevoLote(){abrirFormLote(null);}
function editarLote(id){abrirFormLote(DB.lotes.find(l=>l.id===id));}
function eliminarLote(id){if(!confirm('¿Eliminar?'))return;DB.lotes=DB.lotes.filter(l=>l.id!==id);save();render();toast('Eliminado');}
function abrirFormLote(l){
  openModal(l?'Editar lote':'Nuevo lote',`
    <div class="col"><label class="lbl">Producto</label><input class="inp" id="lProd" value="${esc(l?l.producto:'Yogur griego')}" placeholder="Yogur griego, frozen..."/></div>
    <div class="grid2">
      <div class="col"><label class="lbl">Fecha inicio</label><input class="inp" type="date" id="lFI" value="${l?l.fechaInicio:today()}"/></div>
      <div class="col"><label class="lbl">Fecha fin</label><input class="inp" type="date" id="lFF" value="${l?l.fechaFin:''}"/></div>
    </div>
    <div class="grid3">
      <div class="col"><label class="lbl">Litros</label><input class="inp" type="number" id="lLitros" value="${l?l.litros:''}"/></div>
      <div class="col"><label class="lbl">Unidades</label><input class="inp" type="number" id="lRend" value="${l?l.rendimiento:''}"/></div>
      <div class="col"><label class="lbl">Temp °C</label><input class="inp" type="number" id="lTemp" value="${l?l.tempCultura:42}"/></div>
    </div>
    <div class="col"><label class="lbl">Estado</label>
      <select class="inp" id="lEstado">
        ${['En fermentación','Listo','Entregado','Fallido'].map(e=>`<option${l&&l.estado===e?' selected':''}>${e}</option>`).join('')}
      </select>
    </div>
    <div class="col"><label class="lbl">Notas</label><input class="inp" id="lNotas" value="${esc(l?l.notas:'')}" placeholder="Observaciones..."/></div>
    <button class="btn btn-primary" onclick="guardarLote('${l?l.id:''}')" style="width:100%">✓ Guardar lote</button>
  `);
}
function guardarLote(id){
  const litros=document.getElementById('lLitros').value;
  if(!litros)return toast('Falta la cantidad','err');
  const obj={producto:document.getElementById('lProd').value,fechaInicio:document.getElementById('lFI').value,fechaFin:document.getElementById('lFF').value,litros,rendimiento:document.getElementById('lRend').value,tempCultura:document.getElementById('lTemp').value||42,estado:document.getElementById('lEstado').value,notas:document.getElementById('lNotas').value};
  if(id){DB.lotes=DB.lotes.map(l=>l.id===id?{...obj,id}:l);}else{DB.lotes.push({...obj,id:uid()});}
  save();closeModal();render();toast('Lote guardado');
}

// ════════════════════════════════════════════════════════
// CANJES
// ════════════════════════════════════════════════════════
function renderCanjes(){
  const EC={Propuesto:'yellow',Aceptado:'blue','Contenido recibido':'teal',Finalizado:'green',Cancelado:'red'};
  const NICHOS=['Fitness / Salud','Nutrición','Lifestyle','Foodie','Bienestar','Otro'];
  const ESTADOS=['Propuesto','Aceptado','Contenido recibido','Finalizado','Cancelado'];

  const resumen=ESTADOS.map(e=>{const n=DB.canjes.filter(c=>c.estado===e).length;return n>0?`<div style="display:flex;align-items:center;gap:4px">${badge(e,EC[e])}<span style="font-size:12px;color:#9ca3af">${n}</span></div>`:''}).join('');

  const rows=DB.canjes.length===0
    ?'<div class="empty"><div style="font-size:36px;opacity:.3;margin-bottom:8px">🏆</div><div style="font-weight:600;color:#6b7280">Sin canjes</div><div style="font-size:13px">Registrá tus acuerdos con influencers</div></div>'
    :[...DB.canjes].sort((a,b)=>b.fechaPropuesta.localeCompare(a.fechaPropuesta)).map(c=>`
      <div class="card" style="padding:12px 14px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div style="flex:1;min-width:0">
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
              <span style="font-weight:700;font-size:15px">${esc(c.influencer)}</span>
              ${c.instagram?`<span style="font-size:12px;color:#7c3aed">@${esc(c.instagram)}</span>`:''}
              ${badge(c.estado,EC[c.estado]||'gray')}
            </div>
            <div style="display:flex;gap:8px;margin-top:4px;font-size:12px;color:#6b7280;flex-wrap:wrap">
              ${c.seguidores?`<span>👥 ${Number(c.seguidores).toLocaleString('es-AR')}</span>`:''}
              ${badge(c.nicho,'gray')}
              ${c.producto?`<span>🥛 ${esc(c.producto)}</span>`:''}
            </div>
            ${c.fechaContenido?`<div style="font-size:11px;color:#9ca3af;margin-top:3px">Contenido: ${fmtD(c.fechaContenido)}</div>`:''}
            ${c.notas?`<div style="font-size:11px;color:#9ca3af;margin-top:2px;font-style:italic">${esc(c.notas)}</div>`:''}
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:8px">
            ${c.valorEstimado>0?`<span style="font-size:11px;color:#7c3aed;font-weight:700">${fmt(c.valorEstimado)}</span>`:''}
            <div style="display:flex;gap:4px">
              ${c.estado!=='Finalizado'&&c.estado!=='Cancelado'?`<button class="btn btn-success btn-sm" onclick="avanzarCanje('${c.id}')">✓</button>`:''}
              <button class="btn btn-ghost btn-sm" onclick="editarCanje('${c.id}')">✎</button>
              <button class="btn btn-danger btn-sm" onclick="eliminarCanje('${c.id}')">🗑</button>
            </div>
          </div>
        </div>
      </div>`).join('');

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="font-weight:800;color:#1f2937;font-size:20px">Canjes</h2>
      <button class="btn btn-primary" onclick="nuevoCanje()">+ Nuevo</button>
    </div>
    ${resumen?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">${resumen}</div>`:''}
    ${rows}`;
}

function avanzarCanje(id){
  const ESTADOS=['Propuesto','Aceptado','Contenido recibido','Finalizado','Cancelado'];
  const c=DB.canjes.find(x=>x.id===id);if(!c)return;
  const i=ESTADOS.indexOf(c.estado);
  if(i<ESTADOS.length-1){c.estado=ESTADOS[i+1];save();render();toast('Estado actualizado');}
}
function eliminarCanje(id){if(!confirm('¿Eliminar?'))return;DB.canjes=DB.canjes.filter(c=>c.id!==id);save();render();toast('Eliminado');}
function nuevoCanje(){abrirFormCanje(null);}
function editarCanje(id){abrirFormCanje(DB.canjes.find(c=>c.id===id));}
function abrirFormCanje(c){
  const NICHOS=['Fitness / Salud','Nutrición','Lifestyle','Foodie','Bienestar','Otro'];
  const ESTADOS=['Propuesto','Aceptado','Contenido recibido','Finalizado','Cancelado'];
  openModal(c?'Editar canje':'Nuevo canje',`
    <div class="col"><label class="lbl">Nombre *</label><input class="inp" id="cjNombre" value="${esc(c?c.influencer:'')}" placeholder="Nombre del influencer"/></div>
    <div class="grid2">
      <div class="col"><label class="lbl">Instagram (sin @)</label><input class="inp" id="cjIG" value="${esc(c?c.instagram:'')}" placeholder="handle"/></div>
      <div class="col"><label class="lbl">Seguidores</label><input class="inp" type="number" id="cjSeg" value="${c?c.seguidores:''}" placeholder="3500"/></div>
    </div>
    <div class="grid2">
      <div class="col"><label class="lbl">Nicho</label>
        <select class="inp" id="cjNicho">${NICHOS.map(n=>`<option${c&&c.nicho===n?' selected':''}>${n}</option>`).join('')}</select>
      </div>
      <div class="col"><label class="lbl">Estado</label>
        <select class="inp" id="cjEstado">${ESTADOS.map(e=>`<option${c&&c.estado===e?' selected':''}>${e}</option>`).join('')}</select>
      </div>
    </div>
    <div class="col"><label class="lbl">Producto a entregar</label><input class="inp" id="cjProd" value="${esc(c?c.producto:'')}" placeholder="Ej: 2x yogur 350g"/></div>
    <div class="grid2">
      <div class="col"><label class="lbl">Fecha propuesta</label><input class="inp" type="date" id="cjFP" value="${c?c.fechaPropuesta:today()}"/></div>
      <div class="col"><label class="lbl">Fecha contenido</label><input class="inp" type="date" id="cjFC" value="${c?c.fechaContenido:''}"/></div>
    </div>
    <div class="col"><label class="lbl">Valor estimado ($)</label><input class="inp" type="number" id="cjVal" value="${c?c.valorEstimado:0}"/></div>
    <div class="col"><label class="lbl">Notas</label><input class="inp" id="cjNotas" value="${esc(c?c.notas:'')}" placeholder="Acuerdos, recordatorios..."/></div>
    <button class="btn btn-primary" onclick="guardarCanje('${c?c.id:''}')" style="width:100%">✓ Guardar</button>
  `);
}
function guardarCanje(id){
  const influencer=document.getElementById('cjNombre').value.trim();
  if(!influencer)return toast('Falta el nombre','err');
  const obj={influencer,instagram:document.getElementById('cjIG').value,seguidores:document.getElementById('cjSeg').value,nicho:document.getElementById('cjNicho').value,estado:document.getElementById('cjEstado').value,producto:document.getElementById('cjProd').value,fechaPropuesta:document.getElementById('cjFP').value,fechaContenido:document.getElementById('cjFC').value,valorEstimado:Number(document.getElementById('cjVal').value)||0,notas:document.getElementById('cjNotas').value};
  if(id){DB.canjes=DB.canjes.map(c=>c.id===id?{...obj,id}:c);}else{DB.canjes.push({...obj,id:uid()});}
  save();closeModal();render();toast('Guardado');
}

// ── Init ─────────────────────────────────────────────────────────────────────
load();
render();
</script>
</body>
</html>
